<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library claim sweep</title>
<style>
 body{font-family:sans-serif;margin:0;background:#111;color:#eee}
 video{width:100%;max-height:55vh;background:#000;display:block}
 .bar{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 button{font-size:18px;padding:10px 16px;border:0;border-radius:8px}
 #start{background:#2e7d32;color:#fff} #finish{background:#c62828;color:#fff}
 input{width:60px;font-size:16px;padding:6px}
 #hint{font-size:20px;padding:10px;min-height:28px;color:#ffd54f}
 #heard{padding:0 10px;font-size:14px;color:#90caf9;min-height:18px}
 #inv{padding:6px 10px 10px;font-size:15px;line-height:1.5} a{color:#80cbc4}
</style></head><body>
<video id="v" autoplay playsinline muted></video>
<div class="bar">Country <input id="country" value="IN"> Currency <input id="currency" value="INR">
 <button id="start">Start sweep</button><button id="finish" disabled>Finish</button></div>
<div id="hint">Press Start. I will talk to you while you film, and you can talk back.</div>
<div id="heard"></div>
<div id="inv"></div>
<script>
const v = document.getElementById('v'), hintEl = document.getElementById('hint'), inv = document.getElementById('inv'),
      heardEl = document.getElementById('heard');
let sweepId = null, timer = null, lastSpoken = {text: '', at: 0}, busy = false, speaking = false, rec = null;
let recentSpoken = [], spokeEndAt = 0;  // what the agent said lately: used to ignore its own voice coming back
const canvas = document.createElement('canvas');

// ---- voice out (browser speech). Recognition is paused while we speak so the agent does not hear itself.
function say(text, force) {
  if (!text) return;
  hintEl.textContent = text;
  const now = Date.now();
  if (!force && text === lastSpoken.text && now - lastSpoken.at < 6000) return;
  lastSpoken = {text, at: now};
  recentSpoken = recentSpoken.concat([{text, at: now}]).filter(r => now - r.at < 20000).slice(-3);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN';
  u.onstart = () => { speaking = true; try { rec && rec.stop(); } catch (e) {} };
  u.onend = () => { speaking = false; spokeEndAt = Date.now(); listen(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// Real failure 10 Oct: the mic heard the agent's own hints ("I can't see a shelf marker...") as the user.
// Ignore anything heard while speaking, just after speaking, or that is mostly the agent's own recent words.
function soundsLikeMe(text) {
  const mine = new Set(recentSpoken.map(r => r.text).join(' ').toLowerCase().match(/[a-z]+/g) || []);
  const words = text.toLowerCase().match(/[a-z]+/g) || [];
  if (words.length < 4 || !mine.size) return false;
  return words.filter(w => mine.has(w)).length / words.length >= 0.6;
}

// ---- voice in (browser speech recognition; language fixed so one misheard word cannot switch it)
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !sweepId || speaking) return;
  if (!rec) {
    rec = new SR(); rec.lang = 'en-IN'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = async (e) => {
      const text = e.results[e.results.length - 1][0].transcript.trim();
      if (speaking || Date.now() - spokeEndAt < 1200 || soundsLikeMe(text)) return;
      heardEl.textContent = 'You: ' + text;
      const r = await (await fetch(`/api/sweep/${sweepId}/say`, {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})})).json();
      if (r.cmd === 'finish') { if (!finish.disabled) finish.click(); return; }
      if (r.cmd === 'locale') { country.value = r.country; currency.value = r.currency; }
      if (r.reply) say(r.reply, true);
    };
    rec.onend = () => { if (sweepId && !speaking && timer) setTimeout(listen, 300); };  // keep listening
  }
  try { rec.start(); } catch (e) {}  // already started
}

function showInventory(i) {
  inv.innerHTML = `Units ${i.shelving_units.join(', ') || '-'} · frames kept ${i.frames_kept}/${i.frames_seen} · read ${i.frames_read}` + (i.frames_failed ? ` · <b style="color:#ef5350">failed ${i.frames_failed}</b>` : '') +
    ` · spines ${i.spines_seen} · identified ${i.identified} · items ${i.items_seen} · ${i.elapsed_s}s<br>` +
    (i.recent_titles.length ? 'Recent: ' + i.recent_titles.map(t => t.replace(/</g, '&lt;')).join(' · ') : '');
}

async function sendFrame() {
  if (busy || !sweepId || !v.videoWidth) return;
  busy = true;
  try {
    const w = Math.min(1600, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(v, 0, 0, w, h);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
    const fd = new FormData(); fd.append('file', blob, 'frame.jpg');
    const r = await (await fetch(`/api/sweep/${sweepId}/frame`, {method: 'POST', body: fd})).json();
    if (r.hint) say(r.hint);
    showInventory(r.inventory);
  } catch (e) { hintEl.textContent = 'Connection problem: ' + e; }
  busy = false;
}

document.getElementById('start').onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1920}}, audio: false});
  v.srcObject = stream;
  const body = JSON.stringify({country: country.value, currency: currency.value});
  sweepId = (await (await fetch('/api/sweep/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body})).json()).sweep_id;
  timer = setInterval(sendFrame, 2000);
  start.disabled = true; finish.disabled = false;
  say(`Hi, I will inventory this room for your claim. I have ${country.value === 'IN' ? 'India, prices in rupees' : country.value + ', prices in ' + currency.value}. ` +
      `Say yes, or tell me your country. Then walk slowly along each shelf with the printed square in view. ` +
      `Tell me if a shelf is not yours, or if a book is signed or a first edition. Say finish when you are done.`, true);
};

document.getElementById('finish').onclick = async () => {
  clearInterval(timer); timer = null; finish.disabled = true;
  try { rec && rec.stop(); } catch (e) {}
  say('Sweep finished. Building the claim packet.', true);
  const r = await (await fetch(`/api/sweep/${sweepId}/finish`, {method: 'POST'})).json();
  inv.innerHTML += `<br><b>Packet ready ${r.packet_ready_after_sweep_s}s after the sweep.</b> ` +
    `<a href="${r.report}">Open report</a> · <a href="${r.packet}">JSON</a>`;
  say(r.summary, true);
};
</script></body></html>
